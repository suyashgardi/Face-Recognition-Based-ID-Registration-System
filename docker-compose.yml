services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: SystemV_db
    ports:
      - "5432:5432"
    volumes:
      - ./01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./02-seed-states.sql:/docker-entrypoint-initdb.d/02-seed-states.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SystemV_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  node-api:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: root
      DB_DATABASE: SystemV_db
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  python-ai:
    build:
      context: ./PythonBackend
    ports:
      - "8000:8000"
    depends_on:
      - node-api

  front-end:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - node-api
